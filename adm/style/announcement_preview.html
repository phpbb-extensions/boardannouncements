{% import '@phpbb_boardannouncements/icon_macros.html' as icons %}
{% if BOARD_ANNOUNCEMENTS_PREVIEW %}
	<section class="ba-card ba-form-card ba-preview-card" aria-labelledby="ba-preview-title">
		<div class="ba-card-header ba-preview-header"><div><h2 id="ba-preview-title">{{ lang('BOARD_ANNOUNCEMENTS_PREVIEW') }}</h2></div><div class="ba-preview-tools"><button type="button" class="ba-icon-button" data-ba-preview-mobile title="{{ lang('BOARD_ANNOUNCEMENTS_PREVIEW_MOBILE')|e('html_attr') }}">{{ icons.fa('mobile', 'mobile-screen-button') }}<span class="sr-only">{{ lang('BOARD_ANNOUNCEMENTS_PREVIEW_MOBILE') }}</span></button></div></div>
		<div id="ba-preview" class="ba-preview"><div class="phpbb-announcement phpbb-announcement--{{ BOARD_ANNOUNCEMENTS_TONE }}"{% if BOARD_ANNOUNCEMENTS_BGCOLOR %} style="--ba-background:#{{ BOARD_ANNOUNCEMENTS_BGCOLOR }};--ba-foreground:#{{ BOARD_ANNOUNCEMENTS_TEXTCOLOR }};--ba-accent:#{{ BOARD_ANNOUNCEMENTS_TEXTCOLOR }}"{% endif %}><div class="phpbb-announcement__body">{% if BOARD_ANNOUNCEMENTS_TITLE %}<h2 class="phpbb-announcement__title">{{ BOARD_ANNOUNCEMENTS_TITLE }}</h2>{% endif %}<div class="phpbb-announcement__message">{{ BOARD_ANNOUNCEMENTS_PREVIEW }}</div></div><div class="phpbb-announcement__dismiss-form" data-ba-preview-dismiss{% if not BOARD_ANNOUNCEMENTS_DISMISS %} hidden{% endif %}><button type="button" class="phpbb-announcement__dismiss" title="{{ lang('BOARD_ANNOUNCEMENT_CLOSE')|e('html_attr') }}">{% if constant('PHPBB_VERSION') starts with '4' %}{{ include('@phpbb_boardannouncements/close_icon_phpbb4.html') }}{% else %}<i class="icon fa-fw fa-times" aria-hidden="true"></i><span class="sr-only">{{ lang('BOARD_ANNOUNCEMENT_CLOSE') }}</span>{% endif %}</button></div></div></div>
	</section>
{% endif %}
